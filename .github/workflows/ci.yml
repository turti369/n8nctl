name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check command docs are not stale
        # Only needs to run once — pick the fastest matrix leg.
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: node scripts/gen-command-docs.mjs --check
      - name: Check audit (production deps only)
        run: npm audit --omit=dev --audit-level=high
